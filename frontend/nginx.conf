server {
    listen 80;
    server_name localhost;

    # ── Root: React SPA ────────────────────────────────────────
    root /usr/share/nginx/html;
    index index.html;

    # Tất cả route của React Router → trả index.html
    # (Client-side routing: /profile, /course/1, etc.)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Proxy: API calls → Django backend ───────────────────────
    # Frontend gọi /api/v1/... → Nginx forward sang backend:8000
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ── Proxy: Django Media files (ảnh upload) ───────────────────
    location /media/ {
        proxy_pass http://backend:8000;
    }

    # ── Proxy: Django Static files (admin, DRF UI) ───────────────
    location /static/ {
        proxy_pass http://backend:8000;
    }

    # ── Proxy: Course images được serve bởi Django ────────────────
    location /course_images/ {
        proxy_pass http://backend:8000;
    }

    # Cache static assets (JS, CSS, fonts)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        try_files $uri @backend;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    location @backend {
        proxy_pass http://backend:8000;
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain application/javascript text/css application/json;
    gzip_min_length 1024;
}
